<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — Joy & Glory</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: grid;
        place-items: center;
        background: #fbf6ee;
        color: #2b1a1f;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 420px;
      }
      h1 {
        font-size: 1.6rem;
        color: #4a1420;
        margin-bottom: 8px;
      }
      p {
        line-height: 1.6;
        color: #5c4a4f;
      }
      .rule {
        width: 64px;
        height: 2px;
        background: #c9a24b;
        margin: 16px auto;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Joy &amp; Glory</h1>
      <hr class="rule" />
      <p>You appear to be offline. Please reconnect to view the latest wedding details — this page will refresh automatically once you're back online.</p>
    </div>
  </body>
</html>
